<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tres en Raya Multijugador</title>

  <!-- Favicon -->
  <link rel="icon" href="data:,">

  <!-- Estilos CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet" crossorigin="anonymous" referrerpolicy="no-referrer">
  
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="main-container">
    
    <!-- PANTALLA INICIO -->
    <div id="pantallaInicio" class="text-center">
      <div class="titulo-card">
        <h2>🎮 Tres en Raya Multijugador</h2>
      </div>

      <div class="d-grid gap-3">
        <button id="btnCrearSalaMenu" class="btn btn-menu btn-crear">Crear Nueva Sala</button>
        <button id="btnUnirseSalaMenu" class="btn btn-menu btn-unirse">Unirse a Sala</button>
        <button id="btnVerRankingMenu" class="btn btn-menu btn-ranking">🏆 Ranking Global</button>
      </div>
    </div>

    <!-- PANTALLA CREAR SALA -->
    <div id="pantallaCrear" class="card card-section shadow-sm" style="display: none;">
      <h3 class="mb-3 text-center">Crear Nueva Sala</h3>
      <form id="formCrear">
        <div class="mb-3">
          <label class="form-label">Tu Nombre:</label>
          <input type="text" id="inputNombreCreador" class="form-control" required placeholder="Ej: Alex">
        </div>

        <div class="mb-3">
          <label class="form-label">Máx Jugadores (2-6):</label>
          <select id="selectMaxJugadores" class="form-select">
            <option value="2">2 Jugadores</option>
            <option value="3">3 Jugadores</option>
            <option value="4">4 Jugadores</option>
            <option value="5">5 Jugadores</option>
            <option value="6">6 Jugadores</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-2">Crear y Entrar</button>
        <button type="button" class="btn btn-secondary w-100 btn-volver-menu">Volver</button>
      </form>
    </div>

    <!-- PANTALLA UNIRSE A SALA -->
    <div id="pantallaUnirse" class="card card-section shadow-sm" style="display: none;">
      <h3 class="mb-3 text-center">Unirse a una Sala</h3>
      <form id="formUnirse">
        <div class="mb-3">
          <label class="form-label">Código de Sala:</label>
          <input type="text" id="inputCodigoSala" class="form-control text-uppercase" required placeholder="Ej: X8A1B2">
        </div>
        <div class="mb-3">
          <label class="form-label">Tu Nombre:</label>
          <input type="text" id="inputNombreUnirse" class="form-control" required placeholder="Ej: Maria">
        </div>
        <button type="submit" class="btn btn-success w-100 mb-2">Entrar a la Sala</button>
        <button type="button" class="btn btn-secondary w-100 btn-volver-menu">Volver</button>
      </form>
    </div>

    <!-- PANTALLA LOBBY -->
    <div id="pantallaLobby" class="card card-section shadow-sm text-center" style="display: none;">
      <h3>Sala: <b id="lblCodigoSala" class="text-primary">------</b></h3>
      <p class="text-muted">Esperando a los demás jugadores...</p>
      
      <ul id="listaJugadoresLobby" class="list-group mb-4"></ul>

      <button id="btnIniciarPartida" class="btn btn-success btn-lg w-100 mb-2" style="display: none;">¡Iniciar Partida!</button>
      <button id="btnSalirLobby" class="btn btn-outline-danger w-100">Salir de la Sala</button>
    </div>

    <!-- PANTALLA JUEGO -->
    <div id="pantallaJuego" class="card card-section shadow-sm text-center" style="display: none;">
      <h4 id="lblTurno" class="mb-3">Cargando partida...</h4>

      <!-- Temporizador -->
      <div id="contenedorTemporizador" class="mb-3" style="display: none;">
        <div class="d-flex justify-content-between mb-1">
          <small>Tiempo de Turno:</small>
          <small><b id="lblTimerValue">15</b>s</small>
        </div>
        <div class="progress" style="height: 10px;">
          <div id="barraTemporizador" class="progress-bar bg-success" style="width: 100%;"></div>
        </div>
      </div>

      <!-- Tablero dinámico -->
      <div id="tableroContainer">
        <div id="tablero"></div>
      </div>

      <!-- Chat en vivo -->
      <div class="mt-4 text-start">
        <label class="form-label fw-bold small text-muted">Chat en vivo</label>
        <div id="chatMessages" class="mb-2"></div>
        <form id="formChat" class="d-flex gap-2">
          <input type="text" id="chatInput" class="form-control form-control-sm" placeholder="Escribe un mensaje..." required>
          <button type="submit" class="btn btn-primary btn-sm">Enviar</button>
        </form>
      </div>

      <!-- BOTONES DE ACCIÓN EN JUEGO -->
      <button id="btnRevancha" class="btn btn-success mt-3 w-100 btn-sm" style="display: none;">🔄 Revancha</button>
      <button id="btnSalirPartida" class="btn btn-outline-secondary mt-2 w-100 btn-sm">Abandonar Partida</button>
    </div>

    <!-- PANTALLA RANKING -->
    <div id="pantallaRanking" class="card card-section shadow-sm" style="display: none;">
      <h3 class="mb-3 text-center">🏆 Ranking Global</h3>
      <div class="table-responsive">
        <table class="table table-striped table-hover text-center">
          <thead>
            <tr>
              <th>#</th>
              <th>Jugador</th>
              <th>Ganadas</th>
              <th>Empatadas</th>
              <th>Perdidas</th>
            </tr>
          </thead>
          <tbody id="tbodyRanking"></tbody>
        </table>
      </div>
      <button id="btnBorrarRanking" class="btn btn-outline-danger btn-sm mb-2 w-100">Reiniciar Ranking (Admin)</button>
      <button type="button" class="btn btn-secondary w-100 btn-volver-menu">Volver al Menú</button>
    </div>
  </div>

  <!-- Librerías JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  
  <!-- Lógica Principal en JS -->
  <script src="script.js"></script>
</body>
</html>
